<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BURX Clicker</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font-family:Outfit,system-ui,sans-serif;background:radial-gradient(circle at 20% 0,rgba(139,92,246,.35),transparent 45%),radial-gradient(circle at 85% 100%,rgba(255,61,139,.25),transparent 45%),#0b0716;background-attachment:fixed;display:flex;flex-direction:column;align-items:center;padding:1rem;user-select:none;-webkit-tap-highlight-color:transparent}
h2{font-family:Bungee,cursive;font-size:1rem;margin:0;color:#ffd54a}
button{font:inherit;font-weight:800;border:0;border-radius:.8rem;padding:.6rem .9rem;color:#fff;cursor:pointer;background:#2a1d45;transition:transform .1s,filter .2s;touch-action:manipulation}
button:active:not(:disabled){transform:scale(.95)}button:hover:not(:disabled){filter:brightness(1.15)}button:disabled{opacity:.6;cursor:default}
input,select{width:100%;background:rgba(0,0,0,.45);border:1px solid rgba(255,213,74,.35);color:#ffd54a;border-radius:.7rem;padding:.6rem;font:inherit;font-weight:800;text-align:center}
.hide{display:none!important}
.row{display:flex;gap:.5rem;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column;gap:.5rem}
.wrap{width:100%;max-width:28rem}
.panel{background:rgba(30,18,52,.75);border:1px solid rgba(255,255,255,.1);border-radius:1rem;padding:.8rem;backdrop-filter:blur(8px)}
.gold{background:linear-gradient(#ffe27a,#f5a300);color:#000;box-shadow:0 4px 0 #a86a00,0 0 18px rgba(255,213,74,.4)}
.pink{background:linear-gradient(#ff5c9f,#c4195f)}.green{background:linear-gradient(#34d399,#059669)}
.big{width:100%;padding:.8rem;font-size:.95rem}
.small{font-size:.75rem;color:#a99cc9}
.money{font-family:Bungee,cursive;font-size:2.7rem;background:linear-gradient(#fff3b0,#ffd54a 55%,#e09a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(255,213,74,.55))}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:1.2rem 0}
#click{width:12rem;height:12rem;border-radius:50%;font-size:5.5rem;padding:0;background:radial-gradient(circle at 35% 30%,#ff7aa8,#ff3d8b 45%,#8a0f45);border:5px solid rgba(255,214,74,.8);box-shadow:0 0 0 8px rgba(255,61,139,.15),0 0 45px rgba(255,61,139,.6),inset 0 -10px 25px rgba(0,0,0,.35);animation:glow 2.4s ease-in-out infinite}
#click:active:not(:disabled){transform:scale(.92)}
@keyframes glow{50%{box-shadow:0 0 0 14px rgba(255,61,139,.08),0 0 70px rgba(255,61,139,.85),inset 0 -10px 25px rgba(0,0,0,.35)}}
.float{position:fixed;pointer-events:none;font-family:Bungee;color:#ffd54a;text-shadow:0 2px 6px #000;z-index:60;animation:up .8s ease-out forwards}
@keyframes up{to{opacity:0;transform:translateY(-70px) scale(1.4)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:1rem}
.modal.open{display:flex}
.box{width:100%;max-width:28rem;max-height:92vh;overflow:auto;padding:1.2rem;border-radius:1.4rem;background:linear-gradient(160deg,#1b1030,#0f0820);border:1px solid rgba(255,213,74,.35);box-shadow:0 0 40px rgba(139,92,246,.35)}
.menu{display:block;width:100%;text-align:left;padding:.9rem;margin-bottom:.6rem;background:linear-gradient(90deg,rgba(139,92,246,.35),rgba(255,61,139,.25));border:1px solid rgba(139,92,246,.5)}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:1.7rem;background:linear-gradient(#2a1d45,#170f2b);border:1px solid rgba(139,92,246,.4);border-radius:.6rem;padding:0}
#reels{background:#000;border:3px solid #ffd54a;border-radius:1rem;padding:.5rem;box-shadow:0 0 25px rgba(255,213,74,.45)}
